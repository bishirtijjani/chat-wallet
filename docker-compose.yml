# Local development dependencies. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: caw-postgres
    environment:
      POSTGRES_USER: caw
      POSTGRES_PASSWORD: caw
      POSTGRES_DB: caw
    ports:
      - '5432:5432'
    volumes:
      - caw-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caw']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caw-pgdata:
